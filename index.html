<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap');
    body { font-family: 'Kanit', sans-serif; background-color: #f3f4f6; }
    .table-btn { transition: all 0.2s; }
    .table-btn:active { transform: scale(0.95); }
  </style>
</head>
<body class="pb-10">

  <div class="bg-slate-800 text-white p-4 shadow-md text-center sticky top-0 z-10">
    <h1 class="text-xl font-bold">🍽️ จองโต๊ะออนไลน์</h1>
    <p class="text-xs text-gray-300">ร้านเปิด 16:00 - 05:00 น.</p>
  </div>

  <div class="container mx-auto px-4 mt-6">
    <div id="profile" class="flex items-center gap-3 mb-6 bg-white p-3 rounded-lg shadow-sm hidden">
      <img id="userImg" src="" class="w-10 h-10 rounded-full border">
      <div>
        <div class="text-xs text-gray-500">สวัสดีคุณ</div>
        <div id="userName" class="font-bold text-slate-800">User</div>
      </div>
    </div>

    <h2 class="text-lg font-semibold mb-3 text-slate-700">เลือกโต๊ะที่ต้องการ</h2>
    <div id="tableGrid" class="grid grid-cols-3 gap-3 mb-8">
      <div class="col-span-3 text-center py-10 text-gray-400">กำลังโหลดสถานะโต๊ะ...</div>
    </div>
  </div>

  <div id="bookingModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-end justify-center sm:items-center">
    <div class="bg-white w-full sm:w-96 rounded-t-2xl sm:rounded-2xl p-6 shadow-xl transform transition-all">
      
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-xl font-bold text-slate-800">จองโต๊ะ <span id="modalTableNo" class="text-blue-600"></span></h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">✕</button>
      </div>

      <form id="bookingForm" onsubmit="submitBooking(event)">
        <input type="hidden" id="inputTableNo" name="tableNo">
        
        <div class="mb-3">
          <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อเล่น</label>
          <input type="text" id="inputNickname" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50" placeholder="เช่น พี่แจ็ค">
        </div>

        <div class="mb-3">
          <label class="block text-sm font-medium text-gray-700 mb-1">เบอร์โทรศัพท์</label>
          <input type="tel" id="inputPhone" required pattern="[0-9]{9,10}" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50" placeholder="08xxxxxxxx">
        </div>

        <div class="mb-5">
          <label class="block text-sm font-medium text-gray-700 mb-1">เวลาที่จะเข้า (16:00 - 05:00)</label>
          <input type="time" id="inputTime" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50">
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-slate-800 text-white py-3 rounded-xl font-bold hover:bg-slate-700 shadow-lg">ยืนยันการจอง</button>
      </form>
    </div>
  </div>

  <script>
    // ** ใส่ LIFF ID ของคุณที่นี่ **
    const LIFF_ID = "2008809721-wkEpHOm0"; 
    
    // ดึง URL ของ Web App นี้อัตโนมัติ
    const SCRIPT_URL = "<?= ScriptApp.getService().getUrl() ?>"; 

    let userProfile = null;

    // เริ่มต้นทำงาน
    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        userProfile = await liff.getProfile();
        
        // แสดงรูปและชื่อ
        document.getElementById('userImg').src = userProfile.pictureUrl;
        document.getElementById('userName').innerText = userProfile.displayName;
        document.getElementById('profile').classList.remove('hidden');
        
        // โหลดข้อมูลโต๊ะ
        fetchTableStatus();

      } catch (err) {
        console.error(err);
        Swal.fire('Error', 'ไม่สามารถเชื่อมต่อ LINE ได้', 'error');
      }
    }

    // ดึงสถานะโต๊ะจาก Google Sheet
    function fetchTableStatus() {
      fetch(SCRIPT_URL + "?op=getStatus")
        .then(res => res.json())
        .then(data => renderTables(data))
        .catch(err => console.error(err));
    }

    // วาดปุ่มโต๊ะ
    function renderTables(data) {
      const container = document.getElementById('tableGrid');
      container.innerHTML = "";

      if(data.length === 0) {
        container.innerHTML = "<div class='col-span-3 text-center'>ไม่พบข้อมูลโต๊ะ</div>";
        return;
      }

      data.forEach(row => {
        const tableNo = row[0];
        const status = row[1]; // Available หรือ Busy
        const customer = row[2]; // ชื่อลูกค้า (ถ้ามี)
        
        const isBusy = (status !== 'Available' && status !== 'ว่าง');
        
        const btn = document.createElement('div');
        // สีปุ่ม: ว่าง=ขาว(ขอบเขียว), ไม่ว่าง=แดง
        let colorClass = isBusy ? "bg-red-100 border-red-500 text-red-700 opacity-70 cursor-not-allowed" : "bg-white border-green-500 text-green-700 cursor-pointer hover:bg-green-50 shadow-sm";
        
        btn.className = `table-btn p-4 border-2 rounded-xl flex flex-col items-center justify-center h-24 ${colorClass}`;
        
        btn.innerHTML = `
          <div class="font-bold text-xl">T-${tableNo}</div>
          <div class="text-xs mt-1 truncate w-full text-center">${isBusy ? 'จองแล้ว' : 'ว่าง'}</div>
        `;

        // ถ้าว่าง ให้คลิกเพื่อเปิด Modal จองได้
        if (!isBusy) {
          btn.onclick = () => openBookingModal(tableNo);
        }

        container.appendChild(btn);
      });
    }

    function openBookingModal(tableNo) {
      document.getElementById('modalTableNo').innerText = "T-" + tableNo;
      document.getElementById('inputTableNo').value = tableNo;
      document.getElementById('bookingModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('bookingModal').classList.add('hidden');
    }

    // ส่งข้อมูลการจอง
    function submitBooking(e) {
      e.preventDefault();
      
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "กำลังบันทึก...";

      const formData = {
        action: 'book',
        userId: userProfile.userId,
        displayName: userProfile.displayName,
        tableNo: document.getElementById('inputTableNo').value,
        nickname: document.getElementById('inputNickname').value,
        phone: document.getElementById('inputPhone').value,
        time: document.getElementById('inputTime').value
      };

      // ใช้ fetch แบบ no-cors หรือ text เพราะ Apps Script บางทีมีปัญหา CORS กับ JSON
      fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(formData)
      })
      .then(res => res.json())
      .then(resp => {
        if(resp.status === 'success') {
          Swal.fire({
            title: 'จองสำเร็จ!',
            text: `โต๊ะ T-${formData.tableNo} เวลา ${formData.time}`,
            icon: 'success',
            confirmButtonText: 'ตกลง'
          }).then(() => {
            closeModal();
            fetchTableStatus(); // รีเฟรชสถานะโต๊ะใหม่
            // liff.closeWindow(); // ถ้าต้องการให้ปิดหน้าจอไลน์ไปเลย ให้ uncomment บรรทัดนี้
          });
        } else {
          Swal.fire('เกิดข้อผิดพลาด', resp.message, 'error');
        }
      })
      .catch(err => {
        Swal.fire('Error', 'การเชื่อมต่อขัดข้อง', 'error');
      })
      .finally(() => {
        btn.disabled = false;
        btn.innerText = "ยืนยันการจอง";
      });
    }

    // รันฟังก์ชันหลัก
    main();
  </script>
</body>
</html>
